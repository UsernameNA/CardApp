name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Robolectric's Android 16 runtime needs Java 21, matching the Gradle daemon toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The default package list includes the long-removed `tools` package, which
      # current sdkmanager rejects. AGP downloads the platform and build-tools itself.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
