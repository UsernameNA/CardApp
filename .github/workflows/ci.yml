name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Robolectric's Android 16 runtime needs Java 21, matching the Gradle daemon toolchain.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # AGP downloads the platform and build-tools itself.
      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      # The build exports Room schemas; a schema change must ship with its JSON.
      - name: Check Room schemas are committed
        run: |
          git add -N app/schemas
          git diff --exit-code app/schemas

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 7
