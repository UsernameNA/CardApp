name: Release APK

# Manual only — this workflow must NOT publish releases.
#
# The full card art lives in scripts/images/ (~293MB, 3082 files), which is
# gitignored, so a CI checkout has nothing to bundle. That is how v1.4.0 and
# v1.4.1 shipped with every card blank, at 56MB against v1.3.0's 341MB.
# copyReleaseImages now refuses to build without the art; this workflow waives
# that check because its APK is never published.
#
# Release artifacts are therefore built locally, where scripts/images/ is
# present, and uploaded with `gh release create`. This workflow is kept so the
# release build (minify, shrink, signing) can still be smoke-tested on demand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # AGP downloads the platform and build-tools itself.
      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # CI has no card art, so the image guard must be waived; this APK is never published.
        run: ./gradlew assembleRelease -PallowMissingReleaseImages=true

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-unbundled
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
