<!DOCTYPE html>
<html lang="">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  #canvas { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #canvas canvas { display: block; }
</style>
  <title></title>
</head>
<body>
<div id="canvas"></div>

<script src="three.min.js"></script>
<script src="cannon.min.js"></script>
<script src="teal.js"></script>
<script src="dice.js"></script>
<script>
(function() {
    var canvasHolder = document.getElementById('canvas');
    var box = null;
    var boxW = 0, boxH = 0;
    // Monotonic id so results from a cancelled or superseded roll are dropped
    var activeRoll = 0;

    function ensureBox() {
        var w = window.innerWidth, h = window.innerHeight;
        if (!box || w !== boxW || h !== boxH) {
            canvasHolder.style.width = w + 'px';
            canvasHolder.style.height = h + 'px';
            while (canvasHolder.firstChild) {
                canvasHolder.removeChild(canvasHolder.firstChild);
            }
            box = new $t.dice.dieBox(canvasHolder);
            boxW = w;
            boxH = h;
        }
        return box;
    }

    var notation = {
        set: [{ type: 'd20', dieColor: '#2E2519', labelColor: '#EDD07A' }],
        constant: 0
    };

    window.startRoll = function() {
        var rollId = ++activeRoll;
        var reported = false;
        var b = ensureBox();

        function report(value) {
            if (reported || rollId !== activeRoll) return;
            reported = true;
            clearTimeout(watchdog);
            if (window.Android && Android.onDiceResult) {
                Android.onDiceResult(value);
            }
        }

        // Backup only: dice.js force-reads the real face after 10s of physics.
        // 0 is an explicit "roll failed" signal, never a fabricated result.
        var watchdog = setTimeout(function() { report(0); }, 12000);

        // Throw from below the screen upward with horizontal variation
        var baseAngle = Math.PI / 2;  // 90° = straight up
        var spread = (Math.random() - 0.5) * (Math.PI / 3);  // ±30° horizontal
        var angle = baseAngle + spread;
        var coords = { x: Math.cos(angle), y: Math.sin(angle) };
        var boost = (Math.random() * 0.5 + 1.0) * Math.min(boxW, boxH);

        b.rollDice(notation, coords, boost, null, function(n, result) {
            report(result[0]);
        });
    };

    window.clearDice = function() {
        activeRoll++;
        if (box) box.clear();
    };

    // Warm the renderer and WebGL context during preload
    ensureBox();

    if (window.Android && Android.onDiceReady) {
        Android.onDiceReady();
    }
})();
</script>
</body>
</html>
